name: trip_cal
description: 로그인 없이 준비하는 여행 예산과 체크리스트
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.5
  path: ^1.9.1
  decimal: ^3.2.6
  fl_chart: ^1.3.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  intl: any
  collection: ^1.19.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
flutter:
  uses-material-design: true
  assets:
    - assets/tips/
# Linux test runners use their system SQLite; Android keeps the package default.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
