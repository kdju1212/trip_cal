name: Flutter checks and Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Tool versions
        run: flutter doctor -v
      - name: Dependencies
        run: flutter pub get
      - name: Format sources
        run: dart format lib test
      - name: Save resolved and formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: resolved-flutter-sources
          path: |
            pubspec.lock
            lib/
            test/
          retention-days: 7
      - name: Analyze
        run: flutter analyze
      - name: Test
        timeout-minutes: 5
        run: flutter test --reporter expanded
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Android release-mode test APKs (debug signing)
        run: flutter build apk --release --no-shrink --split-per-abi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: trip-cal-test-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload arm64 installation APK
        uses: actions/upload-artifact@v4
        with:
          name: trip-cal-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build side-by-side arm64 preview
        env:
          ORG_GRADLE_PROJECT_sideBySide: 'true'
        run: flutter build apk --release --no-shrink --split-per-abi --target-platform android-arm64,android-x64
      - name: Verify side-by-side app ID
        run: |
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest application-id build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)" = "com.tripcal.app.preview16"
          "$analyzer" manifest print build/app/outputs/flutter-apk/app-arm64-v8a-release.apk > /tmp/trip-cal-preview-manifest.xml
          grep -q 'com.tripcal.app.MainActivity' /tmp/trip-cal-preview-manifest.xml
          grep -q 'com.tripcal.app.DdayReceiver' /tmp/trip-cal-preview-manifest.xml
      - name: Upload side-by-side preview APK
        uses: actions/upload-artifact@v4
        with:
          name: trip-cal-side-by-side-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload side-by-side emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: trip-cal-side-by-side-x86
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
  emulator_startup:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: ["35"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trip-cal-test-apks
          path: build/app/outputs/flutter-apk
      - uses: actions/download-artifact@v4
        with:
          name: trip-cal-side-by-side-x86
          path: build/preview-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch release app on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          script: |
            scripts/check_android_startup.sh
            adb shell am force-stop com.tripcal.app
            scripts/check_android_startup.sh build/preview-apk/app-x86_64-release.apk com.tripcal.app.preview16
      - name: Save startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics-${{ matrix.api }}
          path: |
            android-startup.log
            android-window.xml
          if-no-files-found: ignore
          retention-days: 7
