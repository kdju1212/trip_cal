name: Flutter checks and Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Tool versions
        run: flutter doctor -v
      - name: Dependencies
        run: flutter pub get
      - name: Format sources
        run: dart format lib test
      - name: Save resolved and formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: resolved-flutter-sources
          path: |
            pubspec.lock
            lib/
            test/
          retention-days: 7
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        timeout-minutes: 5
        run: flutter test --reporter expanded
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Android release-mode test APK (debug signing, test ads)
        run: flutter build apk --release
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: trip-cal-test-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
